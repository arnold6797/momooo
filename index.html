<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MOMO LOANS</title>
    <meta name="description" content="MoMo loan application — two-step flow with embedded money-style logo" />
    <style>
      :root{
        /* Uniform page background (no horizontal bands) */
        --bg: #053f4a;
        --panel: rgba(8,65,78,0.92);
        --card: #0f6a82;
        --border: rgba(255,255,255,0.06);
        --text: #eef9ff;
        --muted: rgba(225,245,250,0.85);
        --muted-2: rgba(190,226,235,0.8);
        --primary: #ffd100;    /* MoMo yellow */
        --primary-strong: #f2c200;
        --shadow: 0 18px 40px rgba(3,12,19,0.45);
        --radius: 14px;
        --maxWidth: 920px;
      }

      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        min-height:100vh;
        font-family:Inter, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color:var(--text);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      main.page {
        max-width: var(--maxWidth);
        margin: 0 auto;
        padding: 28px 16px 64px;
      }

      /* header/logo (square) */
      .topbar{display:flex;justify-content:center;padding:8px 0}
      .brand-logo{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:8px;
        width:220px;
        height:auto;
      }

      .logo-mark{
        width:170px;
        height:170px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:24px;
        overflow:hidden;
        background: transparent;
      }

      .logo-mark svg{
        width:170px;
        height:170px;
        display:block;
        object-fit:contain;
        flex-shrink:0;
      }

      .brand-wordmark{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        line-height:1;
        margin-top:-6px;
      }

      .brand-name{
        font-size:2rem;
        font-weight:900;
        letter-spacing:-0.03em;
        color:var(--primary);
        text-shadow:0 2px 0 rgba(0,0,0,0.08);
      }

      .brand-sub{
        font-size:0.9rem;
        color:var(--primary);
        font-weight:700;
        text-transform:lowercase;
        margin-top:2px;
      }

      .hero{text-align:center;margin-top:6px}
      .site-title{
        margin:12px 0 6px;
        font-size:clamp(2rem,3.2vw,3.2rem);
        line-height:1.05;
        font-weight:900;
        text-transform:uppercase;
        color:var(--primary);
        letter-spacing:0.04em;
      }
      .subtitle{color:var(--muted-2);margin:0 0 18px;font-size:1rem}

      .progress-wrap{max-width:var(--maxWidth);margin:12px auto 20px;padding:0 6px}
      .progress{height:8px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;position:relative}
      .progress .fill{position:absolute;left:0;top:0;bottom:0;width:48%;background:var(--primary)}

      /* main card */
      .card{max-width:var(--maxWidth);margin:10px auto;background:var(--panel);border-radius:18px;padding:24px;border:1px solid var(--border);box-shadow:var(--shadow)}

      .step-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
      .step-pill{padding:6px 10px;border-radius:999px;background:transparent;color:var(--muted);font-weight:700;font-size:0.86rem}

      .card-header{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
      .card-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.06);color:var(--primary);font-weight:700}
      .card-title{font-weight:800;color:var(--text);font-size:1rem}
      .card-copy{color:var(--muted-2);margin:8px 0 14px}

      /* form layout */
      .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
      label{display:flex;flex-direction:column;gap:8px;color:var(--muted-2);font-weight:700}
      input, textarea, select {
        padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);
        background:rgba(255,255,255,0.02);color:var(--text);font-size:0.98rem
      }
      input::placeholder{color:rgba(237,249,255,0.7)}
      input:focus{outline:none;border-color:rgba(255,209,0,0.95);box-shadow:0 0 0 4px rgba(255,209,0,0.08)}
      .full-width{grid-column:1 / -1}

      /* loan section */
      .loan-section{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}
      .loan-section h3{margin:0 0 8px;color:var(--muted-2);font-weight:800}

      .loan-row{display:flex;justify-content:space-between;align-items:center;color:var(--muted-2);font-weight:700}
      .loan-amount{color:var(--primary);font-weight:900}

      /* sliders: JS will set the yellow fill to match the thumb */
      input[type="range"]{ -webkit-appearance:none; width:100%; height:10px; background:transparent; border-radius:999px; }
      input[type="range"]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:rgba(255,255,255,0.06)}
      input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--primary);box-shadow:0 2px 6px rgba(0,0,0,0.45);cursor:pointer}
      input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--primary);cursor:pointer}
      .range-labels{display:flex;justify-content:space-between;color:var(--muted-2);font-size:0.78rem;margin-top:6px}

      /* summary */
      .summary-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;background:rgba(0,0,0,0.06);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04)}
      .summary-box small{color:var(--muted-2);display:block}
      .summary-box strong{color:var(--primary);margin-top:8px;font-weight:900;display:block}

      /* actions */
      .actions{display:flex;gap:12px;justify-content:space-between;margin-top:14px}
      .btn{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:800}
      .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#06343a}
      .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}

      /* submitted screen */
      .submitted-wrap{display:flex;justify-content:center}
      .submitted-card{margin-top:20px;background:var(--panel);border-radius:14px;padding:28px;max-width:520px;border:1px solid var(--border);text-align:center}
      .submitted-card h2{margin:6px 0;color:var(--text)}
      .submitted-copy{color:var(--muted-2);margin-bottom:18px}
      .submitted-summary{background:rgba(255,255,255,0.02);padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);text-align:left}
      .submitted-summary .row{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted-2)}
      .processing{margin-top:14px;color:var(--muted-2);font-size:0.95rem;display:flex;align-items:center;justify-content:center;gap:8px}
      .spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.12);border-top-color:var(--muted-2);animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}

      @media (max-width:880px){
        .grid{grid-template-columns:1fr}
        .summary-box{grid-template-columns:1fr}
        .actions{flex-direction:column-reverse;gap:10px}
        .brand-logo{width:180px}
        .logo-mark{width:150px;height:150px}
      }
    </style>
  </head>

  <body>
    <main class="page" id="app">
      <header class="topbar">
        <div class="brand-logo" aria-label="MoMo from MTN">
          <div class="logo-mark" title="MoMo logo">
            <img src="https://googleusercontent.com" alt="MoMo Logo" width="170" height="170" style="display:block; object-fit:contain;" />
          </div>
        </div>
      </header>
    </main>
  </body>
</html>
