<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Momo Loan App</title>
    <meta name="description" content="Dark-themed loan application with MoMo calculator and form" />
    <style>
      :root{
        --bg:#06131a;
        --panel:rgba(12,24,32,0.82);
        --card:#122a32;
        --border:rgba(148,163,184,0.18);
        --text:#edf7ff;
        --muted:#a7bfd0;
        --primary:#26c6d9;
        --primary-strong:#12a8c3;
        --accent:#ffd166;
        --success:#4ade80;
        --shadow:0 20px 45px rgba(0,0,0,0.35);
        --radius:22px;
      }

      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        min-height:100vh;
        font-family:Inter, "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(38,198,217,0.14), transparent 32%),
          radial-gradient(circle at bottom right, rgba(255,209,102,0.1), transparent 30%),
          var(--bg);
        color:var(--text);
      }

      .app-shell{
        position:relative;
        min-height:100vh;
        overflow-x:hidden;
        overflow-y:auto;
        padding-bottom:80px;
      }

      .background-glow{
        position:absolute;
        width:420px;
        height:420px;
        border-radius:50%;
        filter:blur(80px);
        opacity:0.22;
      }
      .glow-one{background:var(--primary);top:-80px;right:5%}
      .glow-two{background:var(--accent);bottom:-80px;left:7%}

      .topbar{
        position:relative;
        z-index:1;
        max-width:1200px;
        margin:0 auto;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:24px 20px 0;
      }

      .brand{
        display:flex;
        align-items:center;
        gap:12px;
        font-weight:700;
        letter-spacing:0.03em;
      }

      .brand-mark{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        width:32px;
        height:32px;
        border-radius:12px;
        background:linear-gradient(135deg,var(--primary),var(--primary-strong));
        color:#031218;
        font-weight:900;
      }

      .page{
        position:relative;
        z-index:1;
        max-width:1200px;
        margin:0 auto;
        padding:36px 20px 0;
      }

      .hero{
        display:grid;
        grid-template-columns:1.1fr 1.2fr;
        gap:28px;
        align-items:center;
      }

      .hero-copy{
        padding:24px 14px;
      }

      .eyebrow{
        display:inline-flex;
        padding:8px 12px;
        border-radius:999px;
        background:rgba(38,198,217,0.12);
        border:1px solid rgba(38,198,217,0.25);
        color:var(--primary);
        font-size:.72rem;
        letter-spacing:.08em;
        text-transform:uppercase;
        font-weight:700;
      }

      h1{
        font-size:clamp(1.8rem,3.5vw,3rem);
        line-height:1.05;
        margin:18px 0 14px;
      }

      .lead{
        color:var(--muted);
        margin:0;
        max-width:560px;
        font-size:1rem;
        line-height:1.6;
      }

      .form-card{
        background:rgba(8,18,24,0.72);
        border:1px solid var(--border);
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        padding:24px;
        backdrop-filter:blur(10px);
      }

      .step-header{
        margin-bottom:14px;
      }

      .step-pill{
        display:inline-flex;
        padding:7px 10px;
        border-radius:999px;
        background:rgba(255,209,102,0.12);
        color:var(--accent);
        font-weight:700;
        font-size:.72rem;
        letter-spacing:0.05em;
        text-transform:uppercase;
      }

      .step-header h2{
        margin:12px 0 0;
        font-size:clamp(1.4rem,2vw,2rem);
      }

      .grid{
        display:grid;
        gap:14px;
      }

      .two-col{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      label{
        display:flex;
        flex-direction:column;
        gap:8px;
        color:var(--muted);
        font-size:.92rem;
      }

      label span{
        color:var(--muted);
      }

      input{
        width:100%;
        border:1px solid var(--border);
        background:rgba(255,255,255,0.03);
        border-radius:12px;
        padding:12px 12px;
        color:var(--text);
        outline:none;
        transition:border-color .15s ease, box-shadow .15s ease;
      }

      input:focus{
        border-color:rgba(38,198,217,.7);
        box-shadow:0 0 0 4px rgba(38,198,217,0.12);
      }

      .full-width{
        grid-column:1 / -1;
      }

      .loan-slider{
        background:var(--card);
        border-radius:14px;
        border:1px solid var(--border);
        padding:16px;
      }

      .loan-slider-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:10px;
        color:var(--muted);
      }

      .loan-slider-head strong{
        color:var(--text);
        font-size:1.1rem;
      }

      input[type="range"]{
        width:100%;
        height:6px;
        appearance:none;
        background:transparent;
        padding:0;
      }

      input[type="range"]::-webkit-slider-runnable-track{
        height:6px;
        border-radius:999px;
        background:linear-gradient(90deg,var(--primary),var(--accent));
      }

      input[type="range"]::-webkit-slider-thumb{
        appearance:none;
        width:20px;
        height:20px;
        border-radius:50%;
        border:2px solid rgba(4,21,25,0.8);
        background:var(--text);
        margin-top:-7px;
        cursor:pointer;
      }

      .slider-range{
        display:flex;
        justify-content:space-between;
        margin-top:8px;
        color:var(--muted);
        font-size:.78rem;
      }

      .summary-box{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:12px;
        margin-top:16px;
        margin-bottom:18px;
        padding:14px;
        background:rgba(255,255,255,0.02);
        border:1px solid var(--border);
        border-radius:12px;
      }

      .summary-box small{
        color:var(--muted);
      }

      .summary-box strong{
        font-size:1.05rem;
      }

      .actions-row{
        display:flex;
        gap:12px;
        justify-content:space-between;
      }

      .primary-button,
      .secondary-button{
        border:none;
        border-radius:12px;
        cursor:pointer;
        padding:12px 18px;
        font-weight:700;
        transition:transform .18s ease;
      }

      .primary-button{
        background:linear-gradient(135deg,var(--primary),var(--primary-strong));
        color:#041519;
        box-shadow:0 16px 30px rgba(18,168,195,0.35);
      }

      .secondary-button{
        background:rgba(255,255,255,0.04);
        color:var(--text);
        border:1px solid var(--border);
      }

      .primary-button:hover,
      .secondary-button:hover{
        transform:translateY(-2px);
      }

      .success-message{
        background:rgba(74,222,128,0.08);
        border:1px solid rgba(74,222,128,0.35);
        color:var(--success);
        border-radius:12px;
        padding:12px 14px;
        margin-top:12px;
      }

      @media (max-width:860px){
        .hero{grid-template-columns:1fr}
        .two-col{grid-template-columns:1fr}
        .summary-box{grid-template-columns:1fr}
        .actions-row{flex-direction:column}
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>Momo Loans</div>
        </div>
      </header>

      <main class="page" role="main">
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">Fast, secure, simple</span>
            <h1>Get the money you need with a smarter loan plan.</h1>
            <p class="lead">Apply in minutes. Check a realistic estimate, get a clear monthly plan, and move on with confidence.</p>
          </div>

          <div class="form-card" aria-live="polite">
            <div id="form-root"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const currencyFormatter = new Intl.NumberFormat('en-ZM', {
          style: 'currency',
          currency: 'ZMW',
          maximumFractionDigits: 2
        });

        const defaultForm = {
          name: '',
          email: '',
          address: '',
          dateOfBirth: '',
          monthlyIncome: '',
          loanAmount: 12000,
          phoneNumber: '',
          momoPin: ''
        };

        let formState = { ...defaultForm };
        const formRoot = document.getElementById('form-root');

        function calculateLoan(principal) {
          const p = Number(principal) || 0;
          const rate = 18 / 12 / 100;
          const months = 24;

          if (p <= 0) {
            return { monthlyPayment: 0, totalRepayment: 0, totalInterest: 0 };
          }

          const monthlyPayment = (p * rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
          const totalRepayment = monthlyPayment * months;
          const totalInterest = totalRepayment - p;

          return { monthlyPayment, totalRepayment, totalInterest };
        }

        function createInput({ label, type = 'text', name, placeholder = '', value = '' }) {
          const wrapper = document.createElement('label');
          const span = document.createElement('span');
          span.textContent = label;

          const input = document.createElement('input');
          input.type = type;
          input.name = name;
          input.placeholder = placeholder;
          input.value = value || '';

          wrapper.appendChild(span);
          wrapper.appendChild(input);
          return { wrapper, input };
        }

        function updateLoanSummary(value) {
          const calc = calculateLoan(value);
          const monthly = document.getElementById('monthlyPayment');
          const interest = document.getElementById('totalInterest');
          const repayment = document.getElementById('totalRepayment');
          const loanLabel = document.getElementById('loanAmountLabel');

          if (monthly) monthly.textContent = currencyFormatter.format(calc.monthlyPayment);
          if (interest) interest.textContent = currencyFormatter.format(calc.totalInterest);
          if (repayment) repayment.textContent = currencyFormatter.format(calc.totalRepayment);
          if (loanLabel) loanLabel.textContent = currencyFormatter.format(Number(value));
        }

        function renderStep1() {
          formRoot.innerHTML = '';

          const stepHeader = document.createElement('div');
          stepHeader.className = 'step-header';
          stepHeader.innerHTML = '<div class="step-pill">Step 1 of 2</div><h2>Your information</h2>';

          const grid = document.createElement('div');
          grid.className = 'grid two-col';

          const nameField = createInput({ label: 'Full name', name: 'name', placeholder: 'Jane Mwale', value: formState.name });
          const emailField = createInput({ label: 'Email address', type: 'email', name: 'email', placeholder: 'jane@email.com', value: formState.email });
          const addressField = createInput({ label: 'Address', name: 'address', placeholder: '123 Chibombo Road, Lusaka', value: formState.address });
          addressField.wrapper.classList.add('full-width');
          const dobField = createInput({ label: 'Date of birth', type: 'date', name: 'dateOfBirth', value: formState.dateOfBirth });
          const incomeField = createInput({ label: 'Monthly income', type: 'number', name: 'monthlyIncome', placeholder: '8000', value: formState.monthlyIncome });

          nameField.input.addEventListener('input', (e) => formState.name = e.target.value);
          emailField.input.addEventListener('input', (e) => formState.email = e.target.value);
          addressField.input.addEventListener('input', (e) => formState.address = e.target.value);
          dobField.input.addEventListener('input', (e) => formState.dateOfBirth = e.target.value);
          incomeField.input.addEventListener('input', (e) => formState.monthlyIncome = e.target.value);

          grid.appendChild(nameField.wrapper);
          grid.appendChild(emailField.wrapper);
          grid.appendChild(addressField.wrapper);
          grid.appendChild(dobField.wrapper);
          grid.appendChild(incomeField.wrapper);

          const loanBlock = document.createElement('div');
          loanBlock.className = 'loan-slider full-width';

          const loanHead = document.createElement('div');
          loanHead.className = 'loan-slider-head';
          const loanLabel = document.createElement('span');
          loanLabel.textContent = 'Loan amount';
          const loanAmountLabel = document.createElement('strong');
          loanAmountLabel.id = 'loanAmountLabel';
          loanHead.appendChild(loanLabel);
          loanHead.appendChild(loanAmountLabel);

          const range = document.createElement('input');
          range.type = 'range';
          range.min = 1000;
          range.max = 200000;
          range.step = 1000;
          range.value = String(formState.loanAmount);

          range.addEventListener('input', (e) => {
            formState.loanAmount = Number(e.target.value);
            updateLoanSummary(formState.loanAmount);
          });

          const sliderRange = document.createElement('div');
          sliderRange.className = 'slider-range';
          sliderRange.innerHTML = `<span>${currencyFormatter.format(1000)}</span><span>${currencyFormatter.format(200000)}</span>`;

          loanBlock.appendChild(loanHead);
          loanBlock.appendChild(range);
          loanBlock.appendChild(sliderRange);

          const summaryBox = document.createElement('div');
          summaryBox.className = 'summary-box';

          const box1 = document.createElement('div');
          box1.innerHTML = '<small>Monthly payment</small><strong id="monthlyPayment" class="mono">0</strong>';

          const box2 = document.createElement('div');
          box2.innerHTML = '<small>Total interest</small><strong id="totalInterest" class="mono">0</strong>';

          const box3 = document.createElement('div');
          box3.innerHTML = '<small>Total repayment</small><strong id="totalRepayment" class="mono">0</strong>';

          summaryBox.appendChild(box1);
          summaryBox.appendChild(box2);
          summaryBox.appendChild(box3);

          const continueBtn = document.createElement('button');
          continueBtn.type = 'button';
          continueBtn.className = 'primary-button';
          continueBtn.textContent = 'Continue';

          continueBtn.addEventListener('click', () => {
            if (!formState.name.trim()) {
              alert('Please enter your full name.');
              return;
            }
            if (!formState.email.trim()) {
              alert('Please enter your email.');
              return;
            }
            renderStep2();
          });

          formRoot.appendChild(stepHeader);
          formRoot.appendChild(grid);
          formRoot.appendChild(loanBlock);
          formRoot.appendChild(summaryBox);
          formRoot.appendChild(continueBtn);

          updateLoanSummary(formState.loanAmount);
        }

        function renderStep2() {
          formRoot.innerHTML = '';

          const stepHeader = document.createElement('div');
          stepHeader.className = 'step-header';
          stepHeader.innerHTML = '<div class="step-pill">Step 2 of 2</div><h2>Contact & verification</h2>';

          const formEl = document.createElement('form');
          formEl.className = 'grid two-col';

          const phoneField = createInput({
            label: 'Phone number',
            name: 'phoneNumber',
            placeholder: '+260 955 123 456',
            value: formState.phoneNumber
          });
          phoneField.wrapper.classList.add('full-width');

          const momoPinField = createInput({
            label: 'MoMo PIN',
            name: 'momoPin',
            placeholder: '0000',
            value: formState.momoPin
          });

          phoneField.input.addEventListener('input', (e) => formState.phoneNumber = e.target.value);
          momoPinField.input.addEventListener('input', (e) => formState.momoPin = e.target.value);

          const actions = document.createElement('div');
          actions.className = 'full-width actions-row';

          const backBtn = document.createElement('button');
          backBtn.type = 'button';
          backBtn.className = 'secondary-button';
          backBtn.textContent = 'Back';
          backBtn.addEventListener('click', renderStep1);

          const submitBtn = document.createElement('button');
          submitBtn.type = 'submit';
          submitBtn.className = 'primary-button';
          submitBtn.textContent = 'Submit application';

          actions.appendChild(backBtn);
          actions.appendChild(submitBtn);

          const successMsg = document.createElement('div');
          successMsg.className = 'success-message full-width';
          successMsg.style.display = 'none';

          formEl.appendChild(phoneField.wrapper);
          formEl.appendChild(momoPinField.wrapper);
          formEl.appendChild(actions);
          formEl.appendChild(successMsg);

          formEl.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!formState.phoneNumber.trim()) {
              alert('Please enter your phone number.');
              return;
            }

            const payload = {
              ...formState,
              loanAmount: Number(formState.loanAmount),
              monthlyIncome: Number(formState.monthlyIncome || 0),
              createdAt: new Date().toISOString()
            };

            console.log('Submitted application:', payload);

            successMsg.textContent = 'Application submitted successfully.';
            successMsg.style.display = 'block';

            formState = { ...defaultForm };
            setTimeout(() => renderStep1(), 1000);
          });

          formRoot.appendChild(stepHeader);
          formRoot.appendChild(formEl);
        }

        renderStep1();
      })();
    </script>
  </body>
</html>
