<div class="logo-card" aria-label="MoMo from MTN">
  <svg class="momo-logo" viewBox="0 0 300 300" role="img" aria-label="MoMo logo">
    <defs>
      <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#0b6f8a" />
        <stop offset="55%" stop-color="#0b5d7d" />
        <stop offset="100%" stop-color="#0a4f69" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#f7d436" />
        <stop offset="100%" stop-color="#f4c200" />
      </linearGradient>
    </defs>

    <!-- rounded square background -->
    <rect x="15" y="15" width="270" height="270" rx="54" fill="url(#bgGrad)" />

    <!-- subtle shine -->
    <path d="M45 60 C105 28, 190 25, 246 58 L246 85 C184 52, 95 55, 45 92 Z" fill="rgba(255,255,255,0.14)" />

    <!-- yellow emblem / abstract MoMo mark -->
    <path d="M72 186 L115 116 L145 155 L179 98 L195 98 L195 186 L162 186 L162 146 L137 183 L114 154 L92 186 Z" fill="url(#goldGrad)" />
    <circle cx="118" cy="118" r="22" fill="url(#goldGrad)" />
    <path d="M200 206 L227 164 L258 206 Z" fill="url(#goldGrad)" opacity="0.95" />

    <!-- small cut/detail similar to the original mark -->
    <path d="M70 184 L84 172 L103 186 L93 198 Z" fill="#0b5d7d" opacity="0.3" />
  </svg>

  <div class="momo-wordmark">
    <span class="momo-word">MoMo</span>
    <span class="momo-sub">from MTN</span>
  </div>
</div>
